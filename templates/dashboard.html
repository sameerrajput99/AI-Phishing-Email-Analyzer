<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
    <div class="brand">PhishGuard AI</div>
    <div><a href="/">Analyze</a><a href="/dashboard">Dashboard</a></div>
</nav>
<main class="container">
    <section class="result-header">
        <div>
            <p class="eyebrow">Analysis History</p>
            <h1>Incident Dashboard</h1>
        </div>
        <div class="hero-card small"><span>Total Reports</span><strong>{{ total_reports }}</strong></div>
    </section>

    <section class="panel table-wrap">
        <div class="actions top-actions">
            <a href="/" class="secondary-btn">New Analysis</a>
            <a href="/export.csv" class="primary-btn">Export CSV</a>
        </div>
        <table>
            <thead>
                <tr><th>ID</th><th>Date</th><th>Sender</th><th>Subject</th><th>Risk</th><th>Score</th><th>Action</th></tr>
            </thead>
            <tbody>{{ report_rows }}</tbody>
        </table>
    </section>
</main>
</body>
</html>
